[tool.poetry]
name = "doctor-portal"
version = "0.1.0"
description = "Portal-first structured requests for one Indian clinic and doctor"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
django = ">=5.2,<5.3"
psycopg = {version = ">=3.2,<4.0", extras = ["binary"]}
django-otp = ">=1.6,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-django = ">=4.9,<5.0"
black = ">=25.1,<26.0"
isort = ">=6.0,<7.0"
mypy = ">=1.15,<2.0"
django-stubs = {version = ">=5.2,<5.3", extras = ["compatible"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "postgresql: requires a real PostgreSQL database",
    "concurrency: uses independent database connections to test transaction invariants",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
